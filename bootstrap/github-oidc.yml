AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets the image build workflow of a GitHub repository build hatchrun
  runner AMIs with Packer, submit them to AWS Marketplace, keep the
  products' instance types current and prune old AMIs, through GitHub's
  OIDC provider instead of stored keys.

Parameters:
  Repository:
    Type: String
    Default: hatchrun/images
    Description: owner/name of the repository whose build workflow may assume the role.
  SubjectPrefix:
    Type: String
    Default: repo:hatchrun@340033788/images@1411692062
    Description: >-
      Start of the repository's immutable OIDC subject, made of the owner
      and repository ids so a renamed or recreated repository cannot match.
      Read it from GET /repos/{owner}/{repo}/actions/oidc/customization/sub
      (sub_claim_prefix).
  Environment:
    Type: String
    Default: image-build
    Description: >-
      GitHub environment the build job runs in. Restrict its deployment
      branches to main.
  BuildRegion:
    Type: String
    Default: us-east-1
    Description: >-
      Region the builders run in. AWS Marketplace takes source AMIs only
      from us-east-1.
  BuilderInstanceTypes:
    Type: CommaDelimitedList
    Default: c7i.large,c7g.large
    Description: The only instance types the role may launch.
  MarketplaceProductAmd64:
    Type: String
    Default: prod-wwbmhdzdrpsaw
    Description: AWS Marketplace product of the amd64 runner image.
  MarketplaceProductArm64:
    Type: String
    Default: prod-qkoubg5foywny
    Description: AWS Marketplace product of the arm64 runner image.
  MarketplaceOfferAmd64:
    Type: String
    Default: offer-2luhxsba246a4
    Description: Free public offer of the amd64 product.
  MarketplaceOfferArm64:
    Type: String
    Default: offer-xpdprhpcyd4r2
    Description: Free public offer of the arm64 product.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      ARN of an existing token.actions.githubusercontent.com provider. An
      account can hold only one; leave empty to create it.

Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ImageBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hatchrun-image-build
      Description: Assumed by the image build workflow on main to build, submit and prune runner AMIs.
      # The Marketplace scan of a new version can take hours.
      MaxSessionDuration: 14400
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CreateProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Ref ExistingOidcProviderArn
            # The repository's OIDC subject is customised to carry the
            # environment and the workflow file (include_claim_keys repo,
            # context, job_workflow_ref), so only build.yml on main, running
            # in the protected environment, gets in. Pull requests, forks and
            # other workflows get a different subject.
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${SubjectPrefix}:environment:${Environment}:job_workflow_ref:${Repository}/.github/workflows/build.yml@refs/heads/main
      Policies:
        - PolicyName: build-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BaseImage
                Effect: Allow
                Action: ssm:GetParameter
                Resource: arn:aws:ssm:*::parameter/aws/service/canonical/ubuntu/server/*
              # The AMI Marketplace serves for a version in each region,
              # recorded in the release.
              - Sid: MarketplaceAmis
                Effect: Allow
                Action: ssm:GetParameter
                Resource: arn:aws:ssm:*::parameter/aws/service/marketplace/*
              - Sid: Read
                Effect: Allow
                Action:
                  - ec2:DescribeImageAttribute
                  - ec2:DescribeImages
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeInstances
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeRegions
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSnapshots
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcs
                Resource: "*"
              # A stolen token must not be able to start a mining fleet:
              # builders launch only in this region, only as the listed
              # types and only with the build tag.
              - Sid: LaunchBuilderInstance
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:InstanceType: !Ref BuilderInstanceTypes
                  StringLike:
                    aws:RequestTag/hatchrun:image-build: "*"
              - Sid: LaunchBuilderResources
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:${BuildRegion}::image/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:key-pair/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:volume/*
              - Sid: OnlyItsBuilders
                Effect: Allow
                Action:
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                Resource: !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:instance/*
                Condition:
                  StringLike:
                    aws:ResourceTag/hatchrun:image-build: "*"
              # Packer's throwaway SSH key and the security group that
              # opens SSH to the CI runner's address for the build.
              - Sid: TemporaryAccess
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateKeyPair
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteKeyPair
                  - ec2:DeleteSecurityGroup
                Resource:
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:key-pair/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:security-group-rule/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:vpc/*
              - Sid: MakeImages
                Effect: Allow
                Action: ec2:CreateImage
                Resource: "*"
              # Packer sets the AMI's description after creating it. The
              # call only works on this account's own images, and the
              # condition refuses a launch permission change, so the role
              # cannot share an image.
              - Sid: SetImageDescription
                Effect: Allow
                Action: ec2:ModifyImageAttribute
                Resource: !Sub arn:aws:ec2:${BuildRegion}::image/*
                Condition:
                  StringLike:
                    ec2:Attribute/Description: "*"
              - Sid: TagImagesAndBuilders
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${BuildRegion}::image/*
                  - !Sub arn:aws:ec2:${BuildRegion}::snapshot/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:key-pair/*
                  - !Sub arn:aws:ec2:${BuildRegion}:${AWS::AccountId}:security-group/*
              # Old versions cost snapshot storage. Only images and
              # snapshots the build tagged can be deleted.
              - Sid: Prune
                Effect: Allow
                Action:
                  - ec2:DeleteSnapshot
                  - ec2:DeregisterImage
                Resource:
                  - !Sub arn:aws:ec2:${BuildRegion}::image/*
                  - !Sub arn:aws:ec2:${BuildRegion}::snapshot/*
                Condition:
                  StringLike:
                    aws:ResourceTag/hatchrun:image-version: "*"
              # Each build becomes a new version of the Marketplace
              # products. The role can add versions and nothing else: it
              # cannot create, edit, price or publish a product.
              - Sid: MarketplaceAddVersion
                Effect: Allow
                Action: aws-marketplace:StartChangeSet
                Resource:
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/AmiProduct/*
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/ChangeSet/*
                Condition:
                  StringEquals:
                    catalog:ChangeType: AddDeliveryOptions
              - Sid: MarketplaceRead
                Effect: Allow
                Action:
                  - aws-marketplace:DescribeChangeSet
                  - aws-marketplace:DescribeEntity
                Resource: !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/*
              # Finds the change sets still scanning a product's AMIs, so
              # the build waits for them and prune keeps their AMIs.
              # ListChangeSets takes no resource ARN.
              - Sid: MarketplaceListChangeSets
                Effect: Allow
                Action: aws-marketplace:ListChangeSets
                Resource: "*"
              - Sid: MarketplaceIngestion
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt MarketplaceIngestionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: assets.marketplace.amazonaws.com

  # Adds new EC2 instance types to the Marketplace products. Each type
  # needs an hourly dimension and a price on the product's offer, and
  # the offer's rate card is replaced as a whole, so this role can set
  # any price on the two offers. IAM cannot hold it to $0. It is kept
  # apart from the build role, whose jobs run Packer, provisioning and
  # the scanners: only instance-types.yml, which runs the AWS CLI and jq,
  # gets it.
  InstanceTypesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hatchrun-marketplace-instance-types
      Description: Assumed by the instance types workflow on main to add new EC2 types to the runner image products.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CreateProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Ref ExistingOidcProviderArn
            # build.yml calls instance-types.yml, so the subject names the
            # called workflow whether it runs from a build or by hand.
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${SubjectPrefix}:environment:${Environment}:job_workflow_ref:${Repository}/.github/workflows/instance-types.yml@refs/heads/main
      Policies:
        - PolicyName: marketplace-instance-types
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InstanceTypes
                Effect: Allow
                Action:
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeRegions
                Resource: "*"
              - Sid: AddTypesAndDimensions
                Effect: Allow
                Action: aws-marketplace:StartChangeSet
                Resource:
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/AmiProduct/${MarketplaceProductAmd64}
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/AmiProduct/${MarketplaceProductArm64}
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/ChangeSet/*
                Condition:
                  StringEquals:
                    catalog:ChangeType:
                      - AddInstanceTypes
                      - AddDimensions
              - Sid: PriceDimensions
                Effect: Allow
                Action: aws-marketplace:StartChangeSet
                Resource:
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/Offer/${MarketplaceOfferAmd64}
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/Offer/${MarketplaceOfferArm64}
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/ChangeSet/*
                Condition:
                  StringEquals:
                    catalog:ChangeType: UpdatePricingTerms
              - Sid: MarketplaceRead
                Effect: Allow
                Action: aws-marketplace:DescribeEntity
                Resource:
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/AmiProduct/${MarketplaceProductAmd64}
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/AmiProduct/${MarketplaceProductArm64}
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/Offer/${MarketplaceOfferAmd64}
                  - !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/Offer/${MarketplaceOfferArm64}
              - Sid: MarketplaceChangeSets
                Effect: Allow
                Action: aws-marketplace:DescribeChangeSet
                Resource: !Sub arn:aws:aws-marketplace:us-east-1:${AWS::AccountId}:AWSMarketplace/ChangeSet/*
              # Finds the types Marketplace refused lately. ListChangeSets
              # takes no resource ARN.
              - Sid: MarketplaceListChangeSets
                Effect: Allow
                Action: aws-marketplace:ListChangeSets
                Resource: "*"

  # AWS Marketplace copies each new version's AMI into its own catalog
  # and scans it, through this role.
  MarketplaceIngestionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hatchrun-marketplace-ingestion
      Description: Lets AWS Marketplace copy and scan the runner AMIs submitted as product versions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: assets.marketplace.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSMarketplaceAmiIngestion

Outputs:
  RoleArn:
    Value: !GetAtt ImageBuildRole.Arn
  InstanceTypesRoleArn:
    Value: !GetAtt InstanceTypesRole.Arn
  MarketplaceIngestionRoleArn:
    Value: !GetAtt MarketplaceIngestionRole.Arn
