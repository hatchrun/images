name: build

# Builds the runner AMIs with Packer, gates them on a vulnerability scan,
# records the AMIs in a release with an attested manifest, points
# hatchrun-cloud at them (register.yml) and prunes old versions.
#
# Only this workflow, on main, in the image-build environment, can assume
# the AWS role (see bootstrap/github-oidc.yml). The role ARN is an
# environment secret and every credential is masked, because the logs of
# this repository are public.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packer/**
      - provision/**
      - scripts/**
      - versions.env
      - .github/workflows/build.yml

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

env:
  # hatchrun-ci launches runners in us-east-1, where the build makes
  # its AMIs.
  AWS_REGION: us-east-1
  # Keep the newest two versions per architecture so a bad release can
  # be rolled back.
  KEEP_VERSIONS: "2"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    environment: image-build
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
      security-events: write # upload the Trivy results to code scanning
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the build role
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: scripts/assume-role.sh "build-${GITHUB_RUN_ID}-${ARCH}"

      - name: Install Packer and Trivy
        run: |
          . ./versions.env
          cd "${RUNNER_TEMP}"
          curl -fsSL -o packer.zip \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          echo "${PACKER_SHA256_LINUX_AMD64}  packer.zip" | sha256sum --check --strict -
          trivy="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "${trivy}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${trivy}"
          echo "${TRIVY_SHA256_LINUX_X64}  ${trivy}" | sha256sum --check --strict -
          mkdir -p bin
          unzip -q packer.zip -d bin
          tar -xzf "${trivy}" -C bin trivy
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # Packer stops before making an AMI when the scan finds a fixable
      # HIGH or CRITICAL vulnerability, so nothing is released.
      - name: Build
        run: |
          . ./versions.env
          packer init packer/
          packer build -color=false \
            -var "arch=${ARCH}" \
            -var "region=${AWS_REGION}" \
            -var "image_version=${IMAGE_VERSION}" \
            -var "output_dir=out" \
            packer/

      # Code scanning rejects a run with more than 25000 results, and the
      # full scan has about 28600 (every severity, every package location),
      # so only HIGH and CRITICAL go to code scanning. The SBOM keeps every
      # package.
      - name: Scan results to SARIF and SBOM
        run: |
          trivy convert --format sarif --severity HIGH,CRITICAL \
            --output trivy.sarif "out/scan-${ARCH}.json"
          trivy convert --format cyclonedx --output "out/sbom-${ARCH}.cdx.json" "out/scan-${ARCH}.json"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: |
            out/packer-manifest-${{ matrix.arch }}.json
            out/sbom-${{ matrix.arch }}.cdx.json
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    env:
      IMAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Manifest
        run: |
          . ./versions.env
          # The build manifest names its AMI as region:ami-id.
          for arch in amd64 arm64; do
            artifact=$(jq -er '.builds[-1].artifact_id' "packer-manifest-${arch}.json") || {
              echo "No artifact_id in packer-manifest-${arch}.json" >&2
              exit 1
            }
            # Reject a missing or multi-region value before splitting it,
            # so the release never records a bad AMI.
            [[ "${artifact}" =~ ^[a-z0-9-]+:ami-[0-9a-f]+$ ]] || {
              echo "Unexpected artifact_id for ${arch}: ${artifact}" >&2
              exit 1
            }
            jq -n --arg region "${artifact%%:*}" --arg ami "${artifact##*:}" \
              '{($region): $ami}' > "amis-${arch}.json"
          done
          jq -n \
            --arg version "${IMAGE_VERSION}" \
            --arg ubuntu "${UBUNTU_RELEASE}" \
            --arg agent "${AGENT_VERSION}" \
            --argjson amd64 "$(cat amis-amd64.json)" \
            --argjson arm64 "$(cat amis-arm64.json)" \
            '{version: $version, ubuntu: $ubuntu, agent: $agent,
              amis: {amd64: $amd64, arm64: $arm64}}' > manifest.json
          cat manifest.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            manifest.json
            sbom-*.cdx.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ubuntu26-${IMAGE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Ubuntu 26.04 ${IMAGE_VERSION}" \
            --notes "AMI ids per region and architecture are in manifest.json, with a CycloneDX SBOM per architecture. Verify them with gh attestation verify --repo ${GITHUB_REPOSITORY}." \
            --prerelease \
            manifest.json sbom-*.cdx.json

  # hatchrun-cloud launches runners from the AMIs it holds, so it moves
  # to this release only after the release exists.
  register:
    name: Register
    needs: [version, release]
    permissions:
      contents: read # download the release
      attestations: read # verify the manifest's provenance
      id-token: write # OIDC token for hatchrun-cloud
    uses: ./.github/workflows/register.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # The source AMIs are the only copies, so prune keeps the newest two
  # versions and the previous release's AMIs, and runs last, so a failed
  # build leaves its AMI for a re-run.
  prune:
    name: Prune old versions
    needs: [release, register]
    runs-on: ubuntu-latest
    environment: image-build
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the build role
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: scripts/assume-role.sh "prune-${GITHUB_RUN_ID}"

      - name: Prune
        env:
          KEEP: ${{ env.KEEP_VERSIONS }}
          GH_TOKEN: ${{ github.token }} # read the previous release's manifest
        run: scripts/prune.sh
