name: build

# Builds the runner AMIs with Packer, gates them on a vulnerability scan,
# submits them as new versions of the AWS Marketplace products, records
# the AMIs Marketplace serves in a release with an attested manifest,
# points hatchrun-cloud at them (register.yml), adds new EC2 instance
# types to the products (instance-types.yml) and prunes old versions.
#
# Only this workflow, on main, in the image-build environment, can assume
# the AWS role (see bootstrap/github-oidc.yml). The role ARN is an
# environment secret and every credential is masked, because the logs of
# this repository are public.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packer/**
      - provision/**
      - scripts/**
      - versions.env
      - .github/workflows/build.yml

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

env:
  # AWS Marketplace takes source AMIs only from us-east-1.
  AWS_REGION: us-east-1
  # Marketplace keeps its own copy of each version, so a source AMI is
  # only needed until its scan is done.
  KEEP_VERSIONS: "1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    environment: image-build
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
      security-events: write # upload the Trivy results to code scanning
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the build role
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: scripts/assume-role.sh "build-${GITHUB_RUN_ID}-${ARCH}"

      - name: Install Packer and Trivy
        run: |
          . ./versions.env
          cd "${RUNNER_TEMP}"
          curl -fsSL -o packer.zip \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          echo "${PACKER_SHA256_LINUX_AMD64}  packer.zip" | sha256sum --check --strict -
          trivy="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "${trivy}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${trivy}"
          echo "${TRIVY_SHA256_LINUX_X64}  ${trivy}" | sha256sum --check --strict -
          mkdir -p bin
          unzip -q packer.zip -d bin
          tar -xzf "${trivy}" -C bin trivy
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # Packer stops before making an AMI when the scan finds a fixable
      # HIGH or CRITICAL vulnerability, so nothing is submitted or released.
      - name: Build
        run: |
          . ./versions.env
          packer init packer/
          packer build -color=false \
            -var "arch=${ARCH}" \
            -var "region=${AWS_REGION}" \
            -var "image_version=${IMAGE_VERSION}" \
            -var "runner_version=${RUNNER_VERSION}" \
            -var "agent_version=${AGENT_VERSION}" \
            -var "output_dir=out" \
            packer/

      - name: Scan results to SARIF and SBOM
        run: |
          trivy convert --format sarif --output trivy.sarif "out/scan-${ARCH}.json"
          trivy convert --format cyclonedx --output "out/sbom-${ARCH}.cdx.json" "out/scan-${ARCH}.json"

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: |
            out/packer-manifest-${{ matrix.arch }}.json
            out/sbom-${{ matrix.arch }}.cdx.json
          if-no-files-found: error

  # Each architecture is its own Marketplace product, since a product
  # version holds a single AMI. Marketplace copies the AMI, scans it and
  # serves it in every region; the job records those AMIs for the
  # release.
  marketplace:
    name: Marketplace ${{ matrix.arch }}
    needs: [version, build]
    runs-on: ubuntu-latest
    # The waits together give up after 3 hours.
    timeout-minutes: 200
    environment: image-build
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            product_var: MARKETPLACE_PRODUCT_AMD64
          - arch: arm64
            product_var: MARKETPLACE_PRODUCT_ARM64
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE_VERSION: ${{ needs.version.outputs.version }}
      PRODUCT: ${{ vars[matrix.product_var] }}
    steps:
      - name: Product id
        run: |
          if [ -z "${PRODUCT}" ]; then
            echo "::error::${{ matrix.product_var }} is not set in the image-build environment"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}

      - name: Assume the build role
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: scripts/assume-role.sh "marketplace-${GITHUB_RUN_ID}-${ARCH}"

      # A product takes one open change set at a time, so a version still
      # under scan from an earlier build makes the submission fail with
      # ResourceInUseException. Wait up to an hour for it. Its verdict
      # belonged to the earlier build, so a failure is a notice here.
      - name: Wait for earlier versions
        id: earlier
        run: |
          start=$(date +%s)
          open=$(scripts/marketplace-open.sh "${PRODUCT}")
          ids=$(awk '{ print $1 }' <<< "${open}")
          for change_set in ${ids}; do
            echo "waiting for change set ${change_set} of an earlier version"
            scripts/marketplace-wait.sh "${change_set}" 3600 | sed 's/^::error::/::notice::/' || true
          done
          if [ -n "$(scripts/marketplace-open.sh "${PRODUCT}")" ]; then
            echo "::error::an earlier version of ${PRODUCT} is still under review; ${IMAGE_VERSION} is not submitted"
            exit 1
          fi
          echo "wait_seconds=$((10800 - ($(date +%s) - start)))" >> "$GITHUB_OUTPUT"

      - name: Submit the version
        id: submit
        env:
          ACCESS_ROLE_ARN: ${{ secrets.MARKETPLACE_ACCESS_ROLE_ARN }}
        run: |
          . ./versions.env
          export UBUNTU_RELEASE RUNNER_VERSION AGENT_VERSION
          ami=$(jq -r '.builds[-1].artifact_id | split(":")[1]' "packer-manifest-${ARCH}.json")
          change_set=$(scripts/marketplace-version.sh "${PRODUCT}" "${ami}" "${ARCH}")
          echo "change_set=${change_set}" >> "$GITHUB_OUTPUT"

      # Marketplace validates and scans the version after the submission
      # returns; the job reports its verdict.
      - name: Wait for Marketplace
        env:
          CHANGE_SET: ${{ steps.submit.outputs.change_set }}
          WAIT_SECONDS: ${{ steps.earlier.outputs.wait_seconds }}
        run: scripts/marketplace-wait.sh "${CHANGE_SET}" "${WAIT_SECONDS}"

      - name: AMIs per region
        run: scripts/marketplace-amis.sh "${PRODUCT}" "${IMAGE_VERSION}" > "amis-${ARCH}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amis-${{ matrix.arch }}
          path: amis-${{ matrix.arch }}.json
          if-no-files-found: error

  # New EC2 types reach the products here. It runs once the versions are
  # live, since a product takes one open change set at a time, and the
  # release does not wait for it.
  instance-types:
    name: Instance types
    needs: marketplace
    permissions:
      contents: read
      id-token: write # OIDC token for the instance types role
    uses: ./.github/workflows/instance-types.yml
    # A called workflow sees no secrets, its environment's included,
    # unless the caller passes them.
    secrets: inherit

  release:
    name: Release
    needs: [version, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    env:
      IMAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Manifest
        run: |
          . ./versions.env
          jq -n \
            --arg version "${IMAGE_VERSION}" \
            --arg ubuntu "${UBUNTU_RELEASE}" \
            --arg runner "${RUNNER_VERSION}" \
            --arg agent "${AGENT_VERSION}" \
            --argjson amd64 "$(cat amis-amd64.json)" \
            --argjson arm64 "$(cat amis-arm64.json)" \
            '{version: $version, ubuntu: $ubuntu, runner: $runner, agent: $agent,
              amis: {amd64: $amd64, arm64: $arm64}}' > manifest.json
          cat manifest.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            manifest.json
            sbom-*.cdx.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ubuntu26-${IMAGE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Ubuntu 26.04 ${IMAGE_VERSION}" \
            --notes "AMI ids per region and architecture are in manifest.json, with a CycloneDX SBOM per architecture. Verify them with gh attestation verify --repo ${GITHUB_REPOSITORY}." \
            --prerelease \
            manifest.json sbom-*.cdx.json

  # hatchrun-cloud launches runners from the AMIs it holds, so it moves
  # to this release only now that Marketplace serves them.
  register:
    name: Register
    needs: [version, release]
    permissions:
      contents: read # download the release
      attestations: read # verify the manifest's provenance
      id-token: write # OIDC token for hatchrun-cloud
    uses: ./.github/workflows/register.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Runners launch from Marketplace's copies, so the source AMIs here
  # only cost snapshot storage once their scan is done. Prune keeps the
  # newest version and runs last, so a failed build leaves its AMI for a
  # re-run.
  prune:
    name: Prune old versions
    needs: [release, register]
    runs-on: ubuntu-latest
    environment: image-build
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the build role
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: scripts/assume-role.sh "prune-${GITHUB_RUN_ID}"

      # AMIs that Marketplace is still scanning are kept.
      - name: Prune
        env:
          KEEP: ${{ env.KEEP_VERSIONS }}
          PRODUCTS: ${{ vars.MARKETPLACE_PRODUCT_AMD64 }} ${{ vars.MARKETPLACE_PRODUCT_ARM64 }}
        run: scripts/prune.sh
